<svg width="100%" height="200" viewBox="0 0 1000 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#58a6ff"/>
      <stop offset="50%" stop-color="#a371f7"/>
      <stop offset="100%" stop-color="#f778ba"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#21262d" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1000" height="200" fill="url(#bg)"/>
  <rect width="1000" height="200" fill="url(#grid)" opacity="0.5"/>

  <!-- circuit-style connecting lines, left side, nod to test-automation flow diagrams -->
  <g stroke="#30363d" stroke-width="2" fill="none" opacity="0.8">
    <path d="M 30 40 L 90 40 L 90 90 L 150 90"/>
    <path d="M 30 160 L 70 160 L 70 120 L 150 120"/>
    <circle cx="30" cy="40" r="4" fill="#58a6ff"/>
    <circle cx="30" cy="160" r="4" fill="#f778ba"/>
    <circle cx="150" cy="90" r="4" fill="#a371f7"/>
    <circle cx="150" cy="120" r="4" fill="#a371f7"/>
  </g>

  <text x="230" y="88" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="42" font-weight="700" fill="#e6edf3">
    Pratham Mhatre
  </text>
  <text x="230" y="120" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="18" fill="url(#accent)">
    <tspan>SDET</tspan>
    <tspan fill="#8b949e"> :: </tspan>
    <tspan>ML Systems</tspan>
    <tspan fill="#8b949e"> :: </tspan>
    <tspan>Building things that don't silently break</tspan>
  </text>

  <!-- animated typing cursor bar -->
  <rect x="230" y="140" width="12" height="20" fill="#58a6ff">
    <animate attributeName="opacity" values="1;0;1" dur="1.2s" repeatCount="indefinite"/>
  </rect>
  <text x="250" y="157" font-family="'JetBrains Mono', 'Fira Code', monospace" font-size="14" fill="#6e7681">
    assert(system.behaves_as_expected)
  </text>

  <!-- right side decorative nodes: contribution-graph-esque dots -->
  <g>
    <rect x="820" y="35" width="14" height="14" rx="2" fill="#161b2e" stroke="#30363d"/>
    <rect x="840" y="35" width="14" height="14" rx="2" fill="#0e4429"/>
    <rect x="860" y="35" width="14" height="14" rx="2" fill="#26a641"/>
    <rect x="880" y="35" width="14" height="14" rx="2" fill="#39d353"/>
    <rect x="820" y="55" width="14" height="14" rx="2" fill="#006d32"/>
    <rect x="840" y="55" width="14" height="14" rx="2" fill="#39d353"/>
    <rect x="860" y="55" width="14" height="14" rx="2" fill="#161b2e" stroke="#30363d"/>
    <rect x="880" y="55" width="14" height="14" rx="2" fill="#26a641"/>
    <rect x="820" y="75" width="14" height="14" rx="2" fill="#39d353"/>
    <rect x="840" y="75" width="14" height="14" rx="2" fill="#0e4429"/>
    <rect x="860" y="75" width="14" height="14" rx="2" fill="#26a641"/>
    <rect x="880" y="75" width="14" height="14" rx="2" fill="#39d353"/>
  </g>

  <line x1="0" y1="198" x2="1000" y2="198" stroke="url(#accent)" stroke-width="2"/>
</svg>
